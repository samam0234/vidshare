name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: BackendServer (typecheck · test on Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackendServer
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vidshare
          POSTGRES_PASSWORD: vidshare
          POSTGRES_DB: vidshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://vidshare:vidshare@localhost:5432/vidshare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BackendServer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  front:
    name: FrontServer (lint · typecheck · unit test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FrontServer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  console:
    name: console (lint · typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
