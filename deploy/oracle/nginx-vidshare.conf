# /etc/nginx/sites-available/vidshare  (setup-shared-nginx.sh 가 __HOST__ 를 바꿔 설치)
# 다른 서비스(nginx 기본 서버)가 이미 있는 VM 에 VidShare 를 "추가"할 때 쓴다.
# certbot --nginx 가 이 파일에 443 블록과 HTTP→HTTPS 리다이렉트를 덧붙인다.

# WebSocket 업그레이드용. 이름을 vidshare_ 로 시작해 다른 사이트의 map 과 겹치지 않게 한다.
map $http_upgrade $vidshare_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # 영상 100MB + 여유
    client_max_body_size 110m;

    # 업로드 파일은 Node 를 거치지 않고 디스크에서 바로 준다.
    location /uploads/ {
        alias /mnt/vidshare-data/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition inline always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # API · SSE(/api/notifications/stream) · WebSocket(/ws/conversations)
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vidshare_connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 가 버퍼에 쌓이지 않고 바로 흘러가게
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
