# /etc/postgresql/16/main/conf.d/vidshare.conf  (setup-vm.sh 가 설치)
# data_directory 는 conf.d 가 아니라 postgresql.conf 본문에서 바꾼다(Debian 도구가 거기서 읽는다).

# 같은 VM 의 BackendServer 만 접속한다. 5432 를 밖으로 열지 않는다.
listen_addresses = 'localhost'
port = 5432

# Ampere A1 1~2 OCPU / 6~12GB RAM 기준. Node 와 메모리를 나눠 쓴다.
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB
max_connections = 50

timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'
log_min_duration_statement = 500ms
